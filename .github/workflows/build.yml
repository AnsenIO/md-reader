name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      # node_modules is committed, but npm ci keeps it in lockstep with package-lock.json;
      # cap sync regenerates assets/public + capacitor configs from www/ — without it the
      # APK ships an empty web root and the WebView hits ERR_CONNECTION_REFUSED (see .scratch map ticket 02).
      - name: Install deps & sync Capacitor assets
        run: npm ci && npx cap sync android

      - name: Verify synced assets present
        working-directory: android/app/src/main/assets
        run: test -f public/index.html && test -f public/app.js && test -f public/styles.css && test -f capacitor.config.json

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: md-reader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
