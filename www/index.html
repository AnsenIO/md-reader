<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>MD Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>📖 MD Reader</h1>
            <div class="header-buttons">
                <button id="browse-btn" class="btn btn-secondary">Browse</button>
                <button id="file-btn" class="btn btn-primary">Open File</button>
            </div>
        </header>
        
        <div class="file-input-container">
            <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">
        </div>
        
        <div class="content-area" id="content-area">
            <div class="empty-state">
                <p>Tap "Open File" to read a Markdown file</p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
